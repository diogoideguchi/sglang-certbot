name: Build and Push sglang-certbot

on:
  push:
    branches: ["main"]
    paths:
      - "proxy/image/**"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

env:
  IMAGE: hantonio/sglang-certbot

jobs:
  build-and-push:
    name: Build sglang-certbot
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Runner ubuntu-latest tem ~14GB livres — imagem CUDA do sglang
      # (várias camadas torch/cuda) estoura isso sem essa limpeza.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: proxy/image
          file: proxy/image/Dockerfile
          load: true
          tags: sglang-certbot:build-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Extrai versões reais (sglang + certbot) de dentro da imagem
        id: versions
        run: |
          BUILD_TAG="sglang-certbot:build-${{ github.sha }}"
          sglang_ver="$(docker run --rm --entrypoint pip "$BUILD_TAG" show sglang | awk '/^Version:/{print $2}')"
          certbot_ver="$(docker run --rm --entrypoint certbot "$BUILD_TAG" --version | awk '{print $2}')"
          [[ -n "$sglang_ver" && -n "$certbot_ver" ]] || { echo "falha ao extrair versões (sglang='$sglang_ver' certbot='$certbot_ver')"; exit 1; }
          echo "sglang_ver=$sglang_ver" >> "$GITHUB_OUTPUT"
          echo "certbot_ver=$certbot_ver" >> "$GITHUB_OUTPUT"
          echo "tag=$sglang_ver.$certbot_ver" >> "$GITHUB_OUTPUT"

      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag e push
        run: |
          BUILD_TAG="sglang-certbot:build-${{ github.sha }}"
          docker tag "$BUILD_TAG" "${IMAGE}:${{ steps.versions.outputs.tag }}"
          docker tag "$BUILD_TAG" "${IMAGE}:latest"
          docker push "${IMAGE}:${{ steps.versions.outputs.tag }}"
          docker push "${IMAGE}:latest"

      - name: Sumário
        run: echo "Publicado ${IMAGE}:${{ steps.versions.outputs.tag }} (+ :latest)" >> "$GITHUB_STEP_SUMMARY"
